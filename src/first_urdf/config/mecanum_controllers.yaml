controller_manager:
  ros__parameters:
    update_rate: 100

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint

    kinematics:
      wheels_radius: 0.0284
      sum_of_robot_center_projection_on_X_Y_axis: 0.190
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0

    reference_timeout: 1.0

    # NOTE: no linear/angular limit blocks here on purpose.
    # Humble's mecanum_drive_controller DECLARES has_velocity_limits /
    # max_velocity / max_acceleration but contains no code that applies them
    # (verified against the Humble source, and by measurement: with
    # max_velocity 0.6 a command of 1.5 m/s still produced 1.54 m/s).
    # They read back correctly via `ros2 param get`, which makes them a trap.
    #
    # To actually limit speed/acceleration, do it upstream of the controller:
    #   - nav2_velocity_smoother (the standard choice, and Nav2 needs it anyway)
    #   - or teleop_twist_keyboard's own speed settings for manual driving
    # Physical ceiling if you set one: a_max <= mu * g. Roller mu1 = 0.7 gives
    # ~6.9 m/s^2 before slip; ~2.0 m/s^2 is a sane working value.

    use_stamped_vel: false

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
