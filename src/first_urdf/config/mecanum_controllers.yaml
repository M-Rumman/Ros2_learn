controller_manager:
  ros__parameters:
    update_rate: 1000

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint

    kinematics:
      wheels_radius: 0.025
      sum_of_robot_center_projection_on_X_Y_axis: 0.19
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
    
    linear:
      x:
        has_acceleration_limits: true
        max_acceleration: 0.2 # m/s^2 (adjust for ramping speed)
      y:
        has_acceleration_limits: true
        max_acceleration: 0.2
    angular:
      z:
        has_acceleration_limits: true
        max_angular_acceleration: 0.1 # rad/s^2

    tf_frame_prefix_direction: ""
    pose_covariance_diagonal: [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]

    reference_timeout: 1.0
    cmd_vel_timeout: 0.5

    open_loop: false

    use_stamped_vel: false

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
