controller_manager:
  ros__parameters:
    update_rate: 1000

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      # No explicit joints list needed: JointStateBroadcaster publishes
      # every joint state it finds on the hardware interface by default.

mecanum_drive_controller:
  ros__parameters:
    # Maps exactly to the driven joint tags defined in your macro
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint

    kinematics:
      wheels_radius: 0.0267 # matches the actual hub mesh radius (measured
                             # from wheel_hub.STL, not an approximation)
      # lx + ly: lx = ly = wheel_stance (0.08 m each, see robot.xacro) -
      # both equal because the wheel layout is a square.
      sum_of_robot_center_projection_on_X_Y_axis: 0.174
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0

    reference_timeout: 1.0

    # Crucial Fix for ROS 2 Humble teleop_twist_keyboard compatibility:
    # Most standard teleop tools publish un-stamped Twist messages.
    # Setting this to false allows direct /cmd_vel mapping.
    use_stamped_vel: false

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
